services:
  profile-ms:
    container_name: profile-ms
    build: 
      context: ./profile-microservice
      dockerfile: Dockerfile-dev
    volumes:
      - ./profile-microservice:/usr/src/app
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - AZURE_DB_USER=${AZURE_DB_USER}
      - AZURE_DB_PASSWORD=${AZURE_DB_PASSWORD}
      - AZURE_DB_HOST=${AZURE_DB_HOST}
  reviews-ms:
    container_name: reviews-ms
    build: 
      context: ./reviews-microservice
      dockerfile: Dockerfile-dev
    volumes:
      - ./reviews-microservice:/usr/src/app
    environment:
      - AZURE_DB_USER=${AZURE_DB_USER}
      - AZURE_DB_PASSWORD=${AZURE_DB_PASSWORD}
      - AZURE_DB_HOST=${AZURE_DB_HOST}
  music-ms:
    container_name: music-ms
    build:
      context: ./music-ms
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_NAME=${MONGODB_NAME}
      - MONGODB_TIMEOUT=10
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
  music-ms-a:
    container_name: music-ms-a
    build:
      context: ./music-ms
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_NAME=${MONGODB_NAME}
      - MONGODB_TIMEOUT=10
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
  music-ms-b:
    container_name: music-ms-b
    build:
      context: ./music-ms
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_NAME=${MONGODB_NAME}
      - MONGODB_TIMEOUT=10
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
  music-load-balancer:
    image: nginx:latest
    container_name: music-load-balancer
    ports: 
      - "8082:80"
    volumes:
      - ./music-load-balancer/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - music-ms
      - music-ms-a
      - music-ms-b
  streaming-ms:
    container_name: streaming-ms
    build:
      context: ./streaming-ms
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8080"  # Exponer WebSocket para conexión directa desde el frontend
    environment:
      - PORT=8080
      - API_GATEWAY_URL=http://apigateway:8080
      - S3_ACCESS_KEY=${MUSIC_S3_ACCESS_KEY}
      - S3_SECRET_KEY=${MUSIC_S3_SECRET_KEY}
      - S3_BUCKET_NAME=${MUSIC_S3_BUCKET_NAME}
      - AWS_REGION=${MUSIC_AWS_REGION}
    depends_on:
      - apigateway
      - music-ms
  aleph-frontend:
    container_name: aleph-frontend
    build: 
      context: ./aleph-frontend
      dockerfile: Dockerfile.dev
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NODE_TLS_REJECT_UNAUTHORIZED=0  # Acepta certificados self-signed para desarrollo
    extra_hosts:
      - "localhost:host-gateway"  # Permite resolver localhost desde el contenedor
    depends_on:
      - music-ms
      - streaming-ms      
  apigateway:
    container_name: apigateway
    build: 
      context: ./ApiGateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
  aleph_message_queue:
    image: bitnami/kafka:latest
    container_name: aleph_message_queue
    ports:
      - "9092"  
      - "9093"  
    environment:
      - KAFKA_KRAFT_MODE=true
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://aleph_message_queue:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@aleph_message_queue:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
  aleph_kafka_consumer:
    container_name: aleph_kafka_consumer
    build: 
      context: ./kafka-consumer
      dockerfile: Dockerfile
    depends_on:
      - aleph_message_queue
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=aleph_message_queue:9092
      - TOPIC_SONG_PLAYED_NAME=song-played-topic
      - AZURE_DB_USER=${AZURE_DB_USER}
      - AZURE_DB_PASSWORD=${AZURE_DB_PASSWORD}
      - AZURE_DB_HOST=${AZURE_DB_HOST}
      - ANALYSIS_DB_NAME=${ANALYSIS_DB_NAME} 
  analysis-ms:
    container_name: analysis-ms
    build:
      context: ./analysis-ms
      dockerfile: Dockerfile
    environment:
      - DB_HOST=${AZURE_DB_HOST}
      - DB_PORT=5432
      - DB_NAME=${ANALYSIS_DB_NAME}
      - DB_USER=${AZURE_DB_USER}
      - DB_PASSWORD=${AZURE_DB_PASSWORD}
  auth-ms:
    container_name: auth-ms
    build:
      context: ./auth-ms
      dockerfile: Dockerfile
    volumes:
      - ./auth-ms:/app
      - /app/node_modules
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=alephmusicmanagement@gmail.com
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=Aleph <alephmusicmanagement@gmail.com>
      - FRONTEND_URL=https://localhost
      - AUTH_MONGO_URI=${AUTH_MONGO_URI}
    ports:
      - "4000:4000"
  reverse-proxy:
    container_name: reverse-proxy
    build:
      context: ./reverse-proxy
      dockerfile: Dockerfile
    ports:
      - "443:443"
    depends_on:
      - apigateway
      - aleph-frontend
