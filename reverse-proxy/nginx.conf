events {}
worker_processes auto;

http {
    log_format detailed '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'upstream: $upstream_addr '
                       'upstream_status: $upstream_status '
                       'upstream_response_time: $upstream_response_time';
    
    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log debug;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # limit_req_zone $binary_remote_addr zone=limitador_api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=limitador_frontend:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=limitador_ws:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=limitador_oauth:10m rate=10r/s;


    # upstream apigateway {
    #     server 172.20.1.24:80;
    # }
    
    upstream streaming-ms {
        server streaming-ms.aleph-namespace:8080;
    }

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;


    server {
        listen 443 ssl;
        server_name aleph;
        keepalive_timeout   70;

        ssl_certificate /etc/ssl/certs/aleph-cert.pem;
        ssl_certificate_key /etc/ssl/private/aleph-key.pem;

        ### Locations para la comunicación con google oauth

        location /google-auth {
            access_log /var/log/nginx/google_auth_requests.log detailed;
            error_log /var/log/nginx/google_auth_errors.log debug;
            
            return 302 https://accounts.google.com/signin/oauth/oauthchooseaccount$is_args$args;
        }

        location = /accounts.google.com/.well-known/openid-configuration {
            alias /etc/nginx/openid-configuration.json;
            default_type application/json;
        }

        location /googleapis/oauth2/v2/userinfo {
            proxy_pass https://www.googleapis.com/oauth2/v2/userinfo;
            proxy_ssl_verify off;
            proxy_set_header Host www.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_pass_header Accept;
            proxy_pass_header User-Agent;
            
            proxy_connect_timeout 15s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        location /googleapis/oauth2/v3/certs {
            proxy_pass https://www.googleapis.com/oauth2/v3/certs;
            proxy_ssl_verify off;
            proxy_set_header Host www.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /oauth/token {
            access_log /var/log/nginx/token_requests.log detailed;
            error_log /var/log/nginx/token_errors.log debug;
            

            proxy_pass https://oauth2.googleapis.com/token;
            proxy_ssl_verify off;
            proxy_set_header Host oauth2.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            proxy_set_header Accept "application/json";
            proxy_set_header User-Agent "Aleph-Frontend/1.0";
            proxy_redirect off;

            
            proxy_connect_timeout 15s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            add_header X-Debug-Token-Proxy "internal-oauth2-googleapis" always;
        }

        location /oauth2.googleapis.com/token {
            proxy_pass https://oauth2.googleapis.com/token;
            proxy_ssl_verify off;
            proxy_set_header Host oauth2.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            proxy_set_header Accept "application/json";
            proxy_set_header User-Agent "Aleph-Frontend/1.0";
            proxy_redirect off;
        }

        location /oauth/ {
            proxy_pass https://accounts.google.com/;
            proxy_ssl_verify off;
            proxy_set_header Host accounts.google.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Referer $http_referer;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Accept $http_accept;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header Accept-Encoding $http_accept_encoding;
            
            proxy_pass_header Authorization;
            proxy_pass_header Set-Cookie;
            
            #proxy_cookie_domain accounts.google.com $host;
            proxy_cookie_path / /;
            
            proxy_redirect off;
            
            proxy_connect_timeout 15s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
            proxy_busy_buffers_size 16k;

            add_header X-Debug-OAuth "reverse-proxy-oauth" always;
        }

        location /googleapis/ {
            access_log /var/log/nginx/googleapis_requests.log detailed;
            error_log /var/log/nginx/googleapis_errors.log debug;

            proxy_pass https://www.googleapis.com/;
            proxy_ssl_verify off;
            proxy_set_header Host www.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_pass_header Accept;
            proxy_pass_header User-Agent;

            proxy_set_header Accept "application/json";
            proxy_set_header User-Agent "Aleph-Frontend/1.0";
            
            proxy_redirect off;
            
            proxy_connect_timeout 15s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            add_header X-Debug-Proxy "reverse-proxy-googleapis" always;
        }

        ### Location para comunicación del web socket de streaming-ms

        location /ws {
            proxy_pass http://streaming-ms:8080/ws;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_cache_bypass $http_upgrade;
            
        }

        # Location para el frontend

        location / {
            limit_req zone=limitador_frontend burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://aleph-frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

        }



        
    }
}
